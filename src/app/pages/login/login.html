<main class="main-content login-page">
    <div class="container-login">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm"> 
            
            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="ej: cliente@caxambu.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="ej: 123">
            </div>

            <div class="form-options" style="text-align: center; margin-bottom: 2rem;">
              <a href="#" style="color: var(--primary-color); text-decoration: none; font-size: 1.3rem;">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-submit">
                Entrar
            </button>
        </form>
        <p class="register-link">
            ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
        </p>
    </div>
</main>
