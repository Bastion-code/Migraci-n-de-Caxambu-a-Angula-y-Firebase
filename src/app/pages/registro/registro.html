<main class="main-content login-page">
    <div class="container-login">
        <h2>Crear Cuenta</h2>
        <form (ngSubmit)="onSubmit()">

            <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="ej: cliente@caxambu.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" required placeholder="mínimo 6 caracteres">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required>
            </div>

            <button type="submit" class="btn-submit">
                Registrarme
            </button>
        </form>
        <p class="register-link">
            ¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a>
        </p>
    </div>
</main>
