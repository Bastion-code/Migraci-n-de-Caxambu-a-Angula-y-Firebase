<main class="main-content login-page">
    <div class="container-login">
        <h2>Crear Cuenta</h2>
        <form (ngSubmit)="onSubmit()">

            @if (errorMessage) {
              <div class="error-message">{{ errorMessage }}</div>
            }

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="ej: cliente@caxambu.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input
                        [type]="mostrarPassword ? 'text' : 'password'"
                        id="password"
                        name="password"
                        [(ngModel)]="password"
                        required
                        placeholder="mínimo 6 caracteres"
                        style="width: 100%; padding-right: 4.5rem;"
                    >
                    <button
                        type="button"
                        (click)="toggleMostrarPassword()"
                        title="{{ mostrarPassword ? 'Ocultar contraseña' : 'Ver contraseña' }}"
                        style="position: absolute; right: 1.2rem; background: none; border: none; cursor: pointer; color: var(--primary-color); font-size: 1.6rem; padding: 0.4rem; display: flex; align-items: center; justify-content: center;"
                    >
                        <i class="fa-solid" [ngClass]="mostrarPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input
                    [type]="mostrarPassword ? 'text' : 'password'"
                    id="confirmPassword"
                    name="confirmPassword"
                    [(ngModel)]="confirmPassword"
                    required
                >
            </div>

            <button type="submit" class="btn-submit">
                Registrarme
            </button>
        </form>
        <p class="register-link">
            ¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a>
        </p>
    </div>
</main>
